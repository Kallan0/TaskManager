name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check cross-platform dependency lockfile
        run: node scripts/check-native-dependencies.mjs
      - run: npm ci --include=optional
      - name: Verify installed native dependencies
        run: node scripts/check-native-dependencies.mjs --installed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:deployment
  separate-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        folder: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
      - name: Install the standalone package, including build dependencies
        working-directory: ${{ matrix.folder }}
        run: npm ci --include=dev --include=optional --workspaces=false
        env:
          NODE_ENV: production
      - name: Build the standalone package
        working-directory: ${{ matrix.folder }}
        run: npm run build --workspaces=false
